# Plenipo test build: unit tests of the changed modules and a debug APK of the dev and demo flavors,
# kept as a workflow artifact. A tag plenipo-v* also attaches the APKs to a GitHub release.
name: Plenipo build

on:
  push:
    branches: ['plenipo/**', main]
    tags: ['plenipo-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plenipo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests of the mandate mapping and the consent rows
        run: ./gradlew --no-daemon :core-logic:testDevDebugUnitTest :common-feature:testDevDebugUnitTest
      - name: Debug APKs
        run: ./gradlew --no-daemon :app:assembleDevDebug :app:assembleDemoDebug
      - uses: actions/upload-artifact@v4
        with:
          name: plenipo-eudi-wallet-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  release:
    if: startsWith(github.ref, 'refs/tags/plenipo-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plenipo-eudi-wallet-apk
          path: apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes "Debug test build of the EUDI reference wallet with the Plenipo mandate consent screen. For the Plenipo sandbox only; not for real credentials." \
            $(find apk -name '*.apk')
